{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:'Poppins',sans-serif;

            background:
            linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
            url("{% static 'campus2.jpg.jpeg' %}");

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
        }

        .login-card{

            width:420px;

            background:rgba(255,255,255,0.12);

            border:1px solid rgba(255,255,255,0.2);

            backdrop-filter:blur(15px);

            -webkit-backdrop-filter:blur(15px);

            border-radius:25px;

            padding:40px;

            color:white;

            box-shadow:0 8px 30px rgba(0,0,0,0.4);

            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .login-icon{

            text-align:center;
            margin-bottom:20px;
        }

        .login-icon i{

            font-size:75px;
            color:#facc15;
        }

        .login-card h2{

            text-align:center;
            margin-bottom:10px;
            font-weight:bold;
        }

        .login-card p{

            text-align:center;
            color:#ddd;
            margin-bottom:30px;
        }

        .input-group{

            margin-bottom:20px;
        }

        .input-group-text{

            background:#facc15;
            border:none;
            color:black;
            font-weight:bold;
        }

        .form-control{

            background:rgba(255,255,255,0.15);

            border:none;

            color:white;

            padding:12px;
        }

        .form-control::placeholder{
            color:#ddd;
        }

        .form-control:focus{

            background:rgba(255,255,255,0.2);

            color:white;

            box-shadow:none;

            border:1px solid #facc15;
        }

        .login-btn{

            width:100%;

            padding:12px;

            border:none;

            border-radius:12px;

            background:#facc15;

            color:black;

            font-weight:bold;

            transition:0.3s;
        }

        .login-btn:hover{

            background:#ffdd44;

            transform:translateY(-3px);
        }

        .extra-links{

            margin-top:20px;

            display:flex;
            justify-content:space-between;
        }

        .extra-links a{

            color:#facc15;

            text-decoration:none;

            font-size:14px;
        }

        .extra-links a:hover{
            text-decoration:underline;
        }

        .form-check-label{
            color:#eee;
        }

        .show-password{

            cursor:pointer;
        }

        @media(max-width:500px){

            .login-card{
                width:95%;
                padding:25px;
            }
        }

    </style>

</head>

<body>

    <div class="login-card">

        <div class="login-icon">
            <i class="bi bi-mortarboard-fill"></i>
        </div>

        <h2>Student Login</h2>

        <p>
            Login to access your dashboard,
            attendance, results and notices.
        </p>

        <form method="POST">

            {% csrf_token %}

            <!-- Student ID -->

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-person-fill"></i>
                </span>

                <input type="text"
                    class="form-control"
                    name="student_id"
                    placeholder="Enter Student ID"
                    required>

            </div>

            <!-- Password -->

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-lock-fill"></i>
                </span>

                <input type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    required>

                <span class="input-group-text show-password"
                    onclick="togglePassword()">

                    <i class="bi bi-eye-fill"></i>

                </span>

            </div>

            <!-- Remember -->

            <div class="form-check mb-3">

                <input class="form-check-input"
                    type="checkbox"
                    id="remember">

                <label class="form-check-label"
                    for="remember">

                    Remember Me

                </label>

            </div>

            <!-- Button -->

            <button type="submit"
                class="login-btn">

                Login

            </button>

        </form>

        <!-- Links -->

        <div class="extra-links">

            <a href="#">
                Forgot Password?
            </a>

            <a href="#">
                Help Desk
            </a>

        </div>

    </div>

    <script>

        function togglePassword(){

            const password =
            document.getElementById("password");

            if(password.type === "password"){

                password.type = "text";

            }else{

                password.type = "password";
            }
        }

    </script>
    

</body>
</html>

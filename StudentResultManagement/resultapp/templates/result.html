<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced Student Result System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
    font-family:Arial,sans-serif;
}

.card{
    border-radius:20px;
    border:none;
}

.custom-table-head th{
    background:#b89a8ad6;
    color:black;
    font-weight:600;
}

.pass{
    color:green;
    font-weight:bold;
}

.fail{
    color:red;
    font-weight:bold;
}

.result-info{
    background:#f8f9fa;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
}

</style>

</head>

<body>

<div class="container mt-5 mb-5">

<div class="card shadow p-4">

<h2 class="text-center mb-4">
    Student Result System
</h2>

<!-- FORM -->

<div class="row g-3">

<div class="col-md-6">

<label class="form-label">
    Roll Number
</label>

<input type="number"
       id="rollInput"
       class="form-control"
       placeholder="Enter Roll Number (1-70)">

</div>

<div class="col-md-6">

<label class="form-label">
    Select Course
</label>

<select id="courseInput" class="form-select">

<option value="">Select Course</option>

<option>BCA</option>
<option>B.Tech</option>
<option>B.tech -EEE</option>
<option>B.tech -ME</option>
<option>B.tech -DS</option>
<option>MCA</option>
<option>BBA</option>
<option>M.Com</option>
<option>M.Tech -Computer Science</option>
<option>PhD -Physics</option>

</select>

</div>

</div>

<div class="text-center mt-4">

<button class="btn btn-primary px-4"
        onclick="getResult()">

    Check Result

</button>

</div>

<!-- RESULT -->

<div id="resultBox"
     class="mt-5"
     style="display:none;">

<div class="result-info">

<h5 id="studentInfo"></h5>

</div>

<table class="table table-bordered table-striped text-center">

<thead class="custom-table-head">

<tr>

<th>Subject</th>
<th>Marks</th>
<th>Status</th>

</tr>

</thead>

<tbody id="resultTable"></tbody>

</table>

</div>

</div>

</div>

<script>

/* =========================================
   RANDOM MARKS
========================================= */

function randomMarks(){
    return Math.floor(Math.random() * 61) + 20;
}

/* =========================================
   ALL SUBJECTS
========================================= */

const allSubjects = {

"BCA":[
"Programming",
"Database",
"Networking",
"Mathematics",
"Operating System",
"Web Development",
"Python",
"Java"
],

"B.Tech":[
"Physics",
"Chemistry",
"Mathematics",
"Mechanics",
"Electrical",
"Programming",
"Workshop",
"Engineering Graphics"
],

"B.tech -EEE":[
"Power Systems",
"Electrical Machines",
"Circuit Theory",
"Signals",
"Electronics",
"Mathematics",
"Power Electronics",
"Control System"
],

"B.tech -ME":[
"Thermodynamics",
"Fluid Mechanics",
"Machine Design",
"Manufacturing",
"Engineering Drawing",
"Mathematics",
"Robotics",
"Automobile"
],

"B.tech -DS":[
"Python",
"Machine Learning",
"Statistics",
"AI Fundamentals",
"Data Analytics",
"Database",
"Deep Learning",
"Big Data"
],

"MCA":[
"Java",
"Cloud Computing",
"AI",
"Cyber Security",
"Software Engineering",
"Data Structures",
"Networking",
"Web Technology"
],

"BBA":[
"Management",
"Finance",
"Economics",
"Marketing",
"Business Law",
"Accounting",
"Human Resource",
"Business Communication"
],

"M.Com":[
"Taxation",
"Accounting",
"Finance",
"Economics",
"Statistics",
"Research",
"Corporate Law",
"Banking"
],

"M.Tech -Computer Science":[
"Advanced Java",
"Machine Learning",
"Cloud",
"Cyber Security",
"Big Data",
"AI",
"Blockchain",
"Data Mining"
],

"PhD -Physics":[
"Quantum Physics",
"Optics",
"Electrodynamics",
"Nuclear Physics",
"Research Methodology",
"Astrophysics",
"Solid State Physics",
"Particle Physics"
]

};

/* =========================================
   CREATE STUDENTS
========================================= */

const students = {};

/* 
EVERY COURSE = 70 STUDENTS
ROLL NO CONTINUES
*/

let rollNumber = 1;

for(let course in allSubjects){

    for(let i = 1; i <= 70; i++){

        students[rollNumber] = {

            name: "Student " + rollNumber,

            course: course,

            subjects: {}

        };

        allSubjects[course].forEach(subject => {

            students[rollNumber].subjects[subject] =
                randomMarks();

        });

        rollNumber++;

    }

}

console.log(students);

/* =========================================
   RESULT FUNCTION
========================================= */

function getResult(){

    let roll =
        document.getElementById("rollInput").value;

    let course =
        document.getElementById("courseInput").value;

    let table =
        document.getElementById("resultTable");

    let box =
        document.getElementById("resultBox");

    let info =
        document.getElementById("studentInfo");

    table.innerHTML = "";

    /* CHECK EMPTY */

    if(roll === ""){

        alert("Please enter roll number");

        return;

    }

    /* CHECK STUDENT */

    if(!students[roll]){

        alert("Roll Number Not Found");

        return;

    }

    let student = students[roll];

    /* AUTO COURSE SELECT */

    if(course === ""){

        course = student.course;

        document.getElementById("courseInput").value =
            student.course;

    }

    /* COURSE CHECK */

    if(student.course !== course){

        alert(
            "Course mismatch!\n\nCorrect Course: "
            + student.course
        );

        return;

    }

    /* STUDENT INFO */

    info.innerHTML = `
        <b>Name :</b> ${student.name}<br>
        <b>Roll No :</b> ${roll}<br>
        <b>Course :</b> ${student.course}
    `;

    let totalMarks = 0;
    let totalSubjects = 0;

    /* SUBJECTS */

    for(let subject in student.subjects){

        let marks =
            student.subjects[subject];

        let status =
            marks >= 40 ? "Pass" : "Fail";

        totalMarks += marks;
        totalSubjects++;

        table.innerHTML += `

        <tr>

            <td>${subject}</td>

            <td>${marks}</td>

            <td class="${
                status === "Pass"
                ? "pass"
                : "fail"
            }">

            ${status}

            </td>

        </tr>

        `;

    }

    /* TOTAL */

    let percentage =
        (totalMarks / (totalSubjects * 100)) * 100;

    let finalResult =
        percentage >= 40
        ? "PASS"
        : "FAIL";

    table.innerHTML += `

    <tr class="table-warning">

        <td><b>Total</b></td>

        <td colspan="2">
            <b>${totalMarks}</b>
        </td>

    </tr>

    <tr class="table-info">

        <td><b>Percentage</b></td>

        <td colspan="2">
            <b>${percentage.toFixed(2)}%</b>
        </td>

    </tr>

    <tr class="${
        finalResult === "PASS"
        ? "table-success"
        : "table-danger"
    }">

        <td><b>Final Result</b></td>

        <td colspan="2">
            <b>${finalResult}</b>
        </td>

    </tr>

    `;

    box.style.display = "block";

}

</script>

</body>

</html>
